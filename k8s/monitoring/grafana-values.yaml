# helm install grafana grafana/grafana -n monitoring -f k8s/monitoring/grafana-values.yaml
# Grafana propio (la guia permite "Deployment propio"): fuente de datos Prometheus + dashboard cargado por sidecar.
# La clave de admin viene del Secret "grafana-admin" que crea scripts/desplegar.ps1 (no esta en el repo).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
service:
  type: LoadBalancer
  port: 80
persistence:
  enabled: false
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus-lab6
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
