# Service publico de PrestaShop. Se aplica ANTES que el Deployment para conocer la IP (PS_DOMAIN).
apiVersion: v1
kind: Service
metadata:
  name: prestashop
  namespace: prestashop
spec:
  type: LoadBalancer
  # Local conserva la IP real del cliente: PrestaShop liga la sesion del admin a la IP y, con la IP
  # de cada nodo (SNAT), la marcaba como "comprometida" y devolvia al login.
  externalTrafficPolicy: Local
  selector: { app: prestashop }
  ports:
    - port: 80
      targetPort: 80
